# SportsPress Test Environment with LLM Agent Support
# ===================================================
# Provides WordPress + SportsPress + Playwright MCP for automated testing.
#
# Usage:
#   docker compose up -d --wait    # Start all services, wait for healthy
#   docker compose down             # Stop all services
#
# LLM Agent Connection:
#   MCP Server:  http://localhost:3002/sse
#   WordPress:   http://localhost:8082 (auto-login enabled)
#   REST API:    http://localhost:8082/wp-json/test/v1/health
#
# The Playwright container connects to WordPress via the internal
# Docker network at http://sportspress-test:80

services:
  # WordPress + SportsPress + MariaDB (all-in-one)
  sportspress-test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sportspress-test
    ports:
      - "8082:80"
    volumes:
      # Mount each SportsPress Admin Tools plugin from the sibling repo individually —
      # do NOT mount the whole monorepo as one plugin (see Task 6 fix).
      - ../SportsPress-Admin-Tools/sportspress-admin-tools:/var/www/html/wp-content/plugins/sportspress-admin-tools
      - ../SportsPress-Admin-Tools/sportspress-etransfer-automation:/var/www/html/wp-content/plugins/sportspress-etransfer-automation
      - ../SportsPress-Admin-Tools/sportspress-events-manager:/var/www/html/wp-content/plugins/sportspress-events-manager
      - ../SportsPress-Admin-Tools/sportspress-league-manager:/var/www/html/wp-content/plugins/sportspress-league-manager
      - ../SportsPress-Admin-Tools/sportspress-player-registration:/var/www/html/wp-content/plugins/sportspress-player-registration
      - ../SportsPress-Admin-Tools/sportspress-player-tools:/var/www/html/wp-content/plugins/sportspress-player-tools
      - ../SportsPress-Admin-Tools/sportspress-schedule-generator:/var/www/html/wp-content/plugins/sportspress-schedule-generator
      - ../SportsPress-Admin-Tools/sportspress-score-sheets:/var/www/html/wp-content/plugins/sportspress-score-sheets
      - baseline:/var/lib/baseline
      - screenshots:/screenshots
      - test-results:/test-results
    tmpfs:
      - /dev/shm:size=256m
    environment:
      - WORDPRESS_DB_HOST=localhost:/run/mysqld/mysqld.sock
      - WORDPRESS_DB_USER=wordpress
      - WORDPRESS_DB_PASSWORD=wordpress
      - WORDPRESS_DB_NAME=wordpress
      - SPORTSPRESS_SPORT=ice-hockey
    networks:
      - sp-test-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/wp-json/test/v1/health | grep -q '\"status\":\"ready\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

  # Playwright MCP Server — browser automation for LLM agents
  # Exposes an MCP-compatible SSE endpoint that agents connect to.
  # Chromium runs inside this container and navigates to WordPress
  # over the shared Docker network.
  playwright:
    build:
      context: .
      dockerfile: Dockerfile.playwright
    depends_on:
      sportspress-test:
        condition: service_healthy
    ports:
      - "3002:3000"
    shm_size: 1gb
    volumes:
      - screenshots:/screenshots
      - test-results:/test-results
    networks:
      - sp-test-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf --max-time 2 http://localhost:3000/sse | grep -q sessionId"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # Mailpit — captures outgoing emails for verification
  mailpit:
    image: axllent/mailpit:v1.30.7
    ports:
      - "8025:8025"
    networks:
      - sp-test-net

  # Adminer — lightweight database management UI
  adminer:
    image: adminer:6.0.1
    ports:
      - "8088:8080"
    networks:
      - sp-test-net

networks:
  sp-test-net:
    driver: bridge

volumes:
  baseline:
  screenshots:
  test-results:
